<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>Volunteer Sign Up | Hope Commoners Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; }
    .auth-card { width: min(520px, 96vw); padding: 36px 32px; }
    .auth-head { text-align: center; margin-bottom: 22px; }
    .auth-head .brand-logo { width: 60px; height: 60px; font-size: 26px; margin: 0 auto 14px; border-radius: 18px; }
    .auth-head h1 { color: var(--primary); font-size: 1.5rem; }
    .auth-head p { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
    .auth-msg { display: none; padding: 12px 14px; border-radius: 12px; font-size: .86rem; margin-bottom: 16px; }
    .auth-msg.show { display: block; animation: pop .3s var(--ease); }
    .auth-msg.error { background: rgba(215,67,59,.12); color: #b6322b; }
    .auth-msg.success { background: rgba(31,157,99,.14); color: #157a4b; }
    .auth-foot { text-align: center; margin-top: 18px; font-size: .88rem; color: var(--muted); }
    .auth-foot a { color: var(--primary); font-weight: 700; }
    .pw-wrap { position: relative; }
    .pw-toggle { position: absolute; right: 12px; top: 18px; border: none; background: none; color: var(--muted); cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-canvas" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
    <div class="grid-overlay"></div>
  </div>

  <div class="auth-wrap">
    <div class="glass card-block auth-card">
      <div class="auth-head">
        <span class="brand-logo"><img src="../assets/logo.png" alt="HCF" onerror="this.remove()"><i class="fa-solid fa-hands-holding-heart"></i></span>
        <h1>Become a Volunteer</h1>
        <p>Create your account. An admin will approve it before you can log in.</p>
      </div>

      <div class="auth-msg" id="msg"></div>

      <form id="signupForm" novalidate>
        <div class="row g-3">
          <div class="col-md-12">
            <div class="float-field">
              <input type="text" id="name" class="form-control" placeholder=" " required maxlength="80" autocomplete="name" />
              <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="float-field">
              <input type="email" id="email" class="form-control" placeholder=" " required maxlength="120" autocomplete="email" />
              <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="float-field">
              <input type="tel" id="phone" class="form-control" placeholder=" " required inputmode="numeric" maxlength="10" autocomplete="tel" />
              <label for="phone"><i class="fa-solid fa-phone"></i> Phone (10 digits)</label>
            </div>
          </div>
          <div class="col-md-12">
            <div class="float-field">
              <select id="chapter" class="form-select" required>
                <option value="" selected disabled></option>
                <option>Agra</option><option>Ghaziabad</option><option>Future</option>
                <option>Chandigarh</option><option>Noida</option><option>Delhi</option>
              </select>
              <label for="chapter"><i class="fa-solid fa-sitemap"></i> Chapter</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="float-field pw-wrap">
              <input type="password" id="password" class="form-control" placeholder=" " required minlength="6" autocomplete="new-password" />
              <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="float-field">
              <input type="password" id="password2" class="form-control" placeholder=" " required minlength="6" autocomplete="new-password" />
              <label for="password2"><i class="fa-solid fa-lock"></i> Confirm Password</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-gold btn-lg w-100 mt-4" id="signupBtn">
          <i class="fa-solid fa-user-plus me-2"></i>Create Account
        </button>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="login.html">Sign in</a><br>
        <a href="../index.html" style="color:var(--muted);font-weight:500;font-size:.82rem">← Back to home</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var phone = $('#phone');
      phone.addEventListener('input', function () { phone.value = phone.value.replace(/\D/g, '').slice(0, 10); });
      $('#pwToggle').onclick = function () {
        var p = $('#password'); p.type = p.type === 'password' ? 'text' : 'password';
        this.innerHTML = '<i class="fa-solid ' + (p.type === 'password' ? 'fa-eye' : 'fa-eye-slash') + '"></i>';
      };
      function msg(text, kind) { var m = $('#msg'); m.className = 'auth-msg show ' + kind; m.textContent = text; window.scrollTo({ top: 0, behavior: 'smooth' }); }

      $('#signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var p = {
          name: $('#name').value.trim(), email: $('#email').value.trim(),
          phone: $('#phone').value.trim(), chapter: $('#chapter').value,
          password: $('#password').value
        };
        if (!p.name || !p.email || !p.phone || !p.chapter || !p.password) return msg('Please fill all fields.', 'error');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) return msg('Enter a valid email address.', 'error');
        if (!/^\d{10}$/.test(p.phone)) return msg('Phone must be exactly 10 digits.', 'error');
        if (p.password.length < 6) return msg('Password must be at least 6 characters.', 'error');
        if (p.password !== $('#password2').value) return msg('Passwords do not match.', 'error');

        var btn = $('#signupBtn'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Creating…';
        try {
          var r = await HCFAuth.signup(p);
          if (r.status === 'success') {
            $('#signupForm').reset();
            msg('✅ Account created! It is now pending admin approval. You will get an email once approved — then you can log in.', 'success');
          } else msg(r.message || 'Signup failed.', 'error');
        } catch (err) { msg('Network error. Please try again.', 'error'); }
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>Create Account';
      });

      if (window.HCFAuth && HCFAuth.demo()) msg('Demo mode: accounts save locally in this browser only. Deploy the backend for real signups.', 'error');
    })();
  </script>
</body>
</html>
