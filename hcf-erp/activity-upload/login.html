<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>Volunteer Login | Hope Commoners Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; }
    .auth-card { width: min(440px, 96vw); padding: 38px 34px; }
    .auth-head { text-align: center; margin-bottom: 24px; }
    .auth-head .brand-logo { width: 60px; height: 60px; font-size: 26px; margin: 0 auto 14px; border-radius: 18px; }
    .auth-head h1 { color: var(--primary); font-size: 1.5rem; }
    .auth-head p { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
    .auth-msg { display: none; padding: 12px 14px; border-radius: 12px; font-size: .86rem; margin-bottom: 16px; }
    .auth-msg.show { display: block; animation: pop .3s var(--ease); }
    .auth-msg.error { background: rgba(215,67,59,.12); color: #b6322b; }
    .auth-msg.pending { background: rgba(224,149,31,.14); color: #b06f0f; }
    .auth-msg.success { background: rgba(31,157,99,.14); color: #157a4b; }
    .auth-foot { text-align: center; margin-top: 18px; font-size: .88rem; color: var(--muted); }
    .auth-foot a { color: var(--primary); font-weight: 700; }
    .pw-wrap { position: relative; }
    .pw-toggle { position: absolute; right: 12px; top: 18px; border: none; background: none; color: var(--muted); cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-canvas" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
    <div class="grid-overlay"></div>
  </div>

  <div class="auth-wrap">
    <div class="glass card-block auth-card">
      <div class="auth-head">
        <span class="brand-logo"><img src="../assets/logo.png" alt="HCF" onerror="this.remove()"><i class="fa-solid fa-hands-holding-heart"></i></span>
        <h1>Volunteer Login</h1>
        <p>Sign in to upload your chapter activities.</p>
      </div>

      <div class="auth-msg" id="msg"></div>

      <form id="loginForm" novalidate>
        <div class="float-field mb-3">
          <input type="email" id="email" class="form-control" placeholder=" " required autocomplete="email" />
          <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        </div>
        <div class="float-field pw-wrap mb-2">
          <input type="password" id="password" class="form-control" placeholder=" " required autocomplete="current-password" />
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
        </div>
        <button type="submit" class="btn btn-gold btn-lg w-100 mt-3" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
        </button>
      </form>

      <div class="auth-foot">
        New volunteer? <a href="signup.html">Create an account</a><br>
        <a href="../index.html" style="color:var(--muted);font-weight:500;font-size:.82rem">← Back to home</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      // Already logged in? go to portal
      if (window.HCFAuth && HCFAuth.current() && HCFAuth.current().volunteer) location.replace('index.html');

      $('#pwToggle').onclick = function () {
        var p = $('#password'); p.type = p.type === 'password' ? 'text' : 'password';
        this.innerHTML = '<i class="fa-solid ' + (p.type === 'password' ? 'fa-eye' : 'fa-eye-slash') + '"></i>';
      };
      function msg(text, kind) { var m = $('#msg'); m.className = 'auth-msg show ' + kind; m.textContent = text; }

      $('#loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var email = $('#email').value.trim(), pw = $('#password').value;
        if (!email || !pw) return msg('Please enter your email and password.', 'error');
        var btn = $('#loginBtn'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Signing in…';
        try {
          var r = await HCFAuth.login(email, pw);
          if (r.status === 'success') { msg('Welcome back! Redirecting…', 'success'); setTimeout(function () { location.href = 'index.html'; }, 600); }
          else if (r.status === 'pending') msg(r.message || 'Your account is awaiting admin approval.', 'pending');
          else msg(r.message || 'Login failed.', 'error');
        } catch (err) { msg('Network error. Please try again.', 'error'); }
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Sign In';
      });

      if (window.HCFAuth && HCFAuth.demo()) msg('Demo mode: accounts are stored locally in this browser. Deploy the Apps Script backend for real accounts.', 'pending');
    })();
  </script>
</body>
</html>
